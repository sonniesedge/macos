---
- name: Check that Homebrew is installed
  ansible.builtin.stat:
    path: "{{ homebrew_prefix }}/bin/brew"
  register: homebrew_binary

- name: Fail with instructions when Homebrew is missing
  ansible.builtin.fail:
    msg: >-
      Homebrew not found at {{ homebrew_prefix }}/bin/brew.
      Run ./bootstrap.sh first.
  when: not homebrew_binary.stat.exists

- name: Add taps
  community.general.homebrew_tap:
    name: "{{ homebrew_taps }}"
    state: present
  when: homebrew_taps | length > 0

- name: Install formulae
  community.general.homebrew:
    name: "{{ homebrew_formulae }}"
    state: present
  when: homebrew_formulae | length > 0

- name: Install casks
  community.general.homebrew_cask:
    name: "{{ homebrew_casks }}"
    state: present
    accept_external_apps: true
  when: homebrew_casks | length > 0

- name: Upgrade all installed packages
  community.general.homebrew:
    upgrade_all: true
  when: homebrew_upgrade_all | bool

- name: Remove stale downloads and old versions
  ansible.builtin.command: "{{ homebrew_prefix }}/bin/brew cleanup"
  register: homebrew_cleanup
  changed_when: homebrew_cleanup.stdout | length > 0
