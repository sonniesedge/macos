---
# --- Homebrew ---------------------------------------------------------------

homebrew_prefix: "{{ '/opt/homebrew' if ansible_facts['architecture'] == 'arm64' else '/usr/local' }}"

homebrew_taps:
  - anomalyco/tap
  - cloudfoundry/tap
  - hashicorp/tap
  - johanneskaufmann/tap
  - springernature/halfpipe
  - springernature/opensource

homebrew_formulae:
  # cli essentials
  - gh
  - git-filter-repo
  - gnupg
  - pinentry-mac
  - pre-commit
  - tree
  - watch
  # monitoring
  - btop
  - htop
  - macmon
  # containers & k8s
  - colima
  - container-compose
  - docker
  - docker-compose
  - docker-credential-helper
  - kubernetes-cli
  - kubevela
  - trivy
  # languages & runtimes
  - golangci-lint
  - nvm
  - python@3.13
  - ruby@3.4
  - uv
  # tapped
  - anomalyco/tap/opencode
  - cloudfoundry/tap/cf-cli@8
  - hashicorp/tap/terraform
  - hashicorp/tap/vault
  - johanneskaufmann/tap/html2markdown
  - springernature/halfpipe/halfpipe
  - springernature/opensource/opencode-copilot-credit-estimator

homebrew_casks:
  - 1password
  - 1password-cli
  - firefox
  - gcloud-cli
  - gpg-suite
  - iterm2
  - microsoft-teams
  - obsidian
  - utm
  - visual-studio-code
  - zoom

homebrew_upgrade_all: false

# --- Git --------------------------------------------------------------------

git_user_name: "Charlie Owen"
git_user_email: "charlie.owen@springernature.com"
git_signing_key: "C9D0B8AD05192403"

git_config:
  init.defaultBranch: main
  pull.rebase: "true"
  push.autoSetupRemote: "true"
  push.default: current
  fetch.prune: "true"
  rebase.autosquash: "true"
  rebase.autostash: "true"
  commit.gpgsign: "true"
  tag.gpgsign: "true"
  diff.colorMoved: zebra
  merge.conflictstyle: zdiff3
  core.editor: nvim
  help.autocorrect: prompt

git_aliases:
  st: status --short --branch
  co: checkout
  br: branch
  last: log -1 HEAD --stat
  unstage: reset HEAD --
  lg: log --oneline --graph --decorate --all

git_ignore_global:
  - .DS_Store
  - .direnv/
  - .env
  - .venv/
  - node_modules/
  - "*.log"

# --- Shell and dotfiles -----------------------------------------------------

shell_default: /bin/zsh

oh_my_zsh_install: true
zsh_theme: robbyrussell
zsh_plugins:
  - git

zsh_env:
  GITHUB_USERNAME: sonniesedge
  GITHUB_ORG: springernature
  USER_EMAIL: "{{ git_user_email }}"
  VAULT_ADDR: https://vault.halfpipe.io

zsh_secrets:
  VAULT_GITHUB_TOKEN:
    uuid: nys3drs2zu3qp7jirairmerhzu   # "Github Vault token"
    field: notesPlain
  GITHUB_TOKEN:
    uuid: ls6rdhcuslacaog4sjdqhp5bxm   # generic GitHub token
    field: notesPlain

zsh_path_prepend:
  - "{{ homebrew_prefix }}/lib/ruby/gems/3.4.0/bin"
  - "{{ ansible_facts['env'].HOME }}/.cargo/bin"

zsh_extra_lines: []

chezmoi_remove: false

# --- macOS defaults ---------------------------------------------------------

macos_defaults:
  # Finder
  - { domain: com.apple.finder, key: AppleShowAllFiles, type: bool, value: "true" }
  - { domain: com.apple.finder, key: ShowPathbar, type: bool, value: "true" }
  - { domain: com.apple.finder, key: ShowStatusBar, type: bool, value: "true" }
  - { domain: com.apple.finder, key: FXPreferredViewStyle, type: string, value: Nlsv }
  - { domain: com.apple.finder, key: _FXSortFoldersFirst, type: bool, value: "true" }
  - { domain: com.apple.finder, key: FXDefaultSearchScope, type: string, value: SCcf }
  - { domain: NSGlobalDomain, key: AppleShowAllExtensions, type: bool, value: "true" }

  # Desktop clutter
  - { domain: com.apple.finder, key: CreateDesktop, type: bool, value: "false" }

  # Dock
  - { domain: com.apple.dock, key: autohide, type: bool, value: "true" }
  - { domain: com.apple.dock, key: autohide-delay, type: float, value: "0" }
  - { domain: com.apple.dock, key: show-recents, type: bool, value: "false" }
  - { domain: com.apple.dock, key: tilesize, type: float, value: "48" }
  - { domain: com.apple.dock, key: mru-spaces, type: bool, value: "false" }

  # Keyboard
  - { domain: NSGlobalDomain, key: InitialKeyRepeat, type: int, value: "15" }
  - { domain: NSGlobalDomain, key: KeyRepeat, type: int, value: "2" }
  - { domain: NSGlobalDomain, key: ApplePressAndHoldEnabled, type: bool, value: "false" }
  - { domain: NSGlobalDomain, key: NSAutomaticCapitalizationEnabled, type: bool, value: "false" }
  - { domain: NSGlobalDomain, key: NSAutomaticDashSubstitutionEnabled, type: bool, value: "false" }
  - { domain: NSGlobalDomain, key: NSAutomaticQuoteSubstitutionEnabled, type: bool, value: "false" }
  - { domain: NSGlobalDomain, key: NSAutomaticSpellingCorrectionEnabled, type: bool, value: "false" }

  # Trackpad
  - { domain: com.apple.AppleMultitouchTrackpad, key: Clicking, type: bool, value: "true" }
  - { domain: com.apple.driver.AppleBluetoothMultitouch.trackpad, key: Clicking, type: bool, value: "true" }
  - { domain: NSGlobalDomain, key: "com.apple.mouse.tapBehavior", type: int, value: "1" }
  - { domain: NSGlobalDomain, key: "com.apple.mouse.tapBehavior", type: int, value: "1", host: currentHost }
  - { domain: NSGlobalDomain, key: "com.apple.swipescrolldirection", type: bool, value: "true" }

  # Screenshots
  - { domain: com.apple.screencapture, key: type, type: string, value: png }
  - { domain: com.apple.screencapture, key: disable-shadow, type: bool, value: "false" }

  # Save/print panels and misc
  - { domain: NSGlobalDomain, key: NSNavPanelExpandedStateForSaveMode, type: bool, value: "true" }
  - { domain: NSGlobalDomain, key: PMPrintingExpandedStateForPrint, type: bool, value: "true" }
  - { domain: NSGlobalDomain, key: NSDocumentSaveNewDocumentsToCloud, type: bool, value: "false" }
  - { domain: com.apple.LaunchServices, key: LSQuarantine, state: absent }

macos_apps_to_restart:
  - Dock
  - Finder
  - SystemUIServer

macos_computer_name: ""
